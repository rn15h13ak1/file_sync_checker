# File Sync Checker - 設定ファイルサンプル
# 実環境用は config.yaml にコピーして書き換えてください。

# 比較する拠点。
# 比較したい組ごとに名前を付けて並べます。組が 1 つでも複数でも書き方は同じです。
#
#   - 組が 1 つだけなら、実行時に比較名の指定は要りません
#   - 組が 2 つ以上なら、実行時に --comparison で選びます
#     (メニューからは「チェックを実行」を選ぶと一覧から選べます)
#
# 比較名はレポートのファイル名に入ります (sync-check-契約書-YYYYMMDD-HHMMSS.html)。
# そのため \ / : * ? " < > | は使えません。
comparisons:
  契約書:
    - name: "本社"
      path: "//srv-hq/share/契約書"
    - name: "大阪支店"
      path: "//srv-osaka/share/契約書"

  # 2 組目以降は同じ形で足すだけです
  # 設計:
  #   - name: "本社"
  #     path: "//srv-hq/share/設計"
  #   - name: "大阪支店"
  #     path: "//srv-osaka/share/設計"
  #   - name: "名古屋支店"
  #     path: "//srv-nagoya/share/設計"

# 【従来形式】トップレベルに locations を書く形も引き続きサポートします。
# 既に配布した config.yaml をそのまま使い続けられるようにするためで、
# 新しい版へ入れ替えても書き換えは不要です (レポート名も従来どおり)。
# comparisons と同時には指定できません。新しく書く場合は comparisons を使ってください。
#
# locations:
#   - name: "拠点A"
#     path: "//server-a/share/docs"
#   - name: "拠点B"
#     path: "//server-b/share/docs"

# 除外パターン (glob)。
#   "/" を含まないパターン … ファイル名・ディレクトリ名と照合 (深さを問わない)
#   "/" を含むパターン     … ルートからの相対パス全体と照合
exclude_patterns:
  - "~$*"        # Office 一時ファイル
  - "*.tmp"
  - "Thumbs.db"
  - ".DS_Store"
  - "*.lnk"
  # - "作業中/*"      # 特定フォルダ配下だけ除外したい場合
  # - "*/一時/*"

# 拠点間で「同じファイル」とみなす条件。
matching:
  # ファイル名を NFC に正規化してから突き合わせる (既定 true)。
  # macOS は「が」を「か」+ 濁点 (NFD) で返し、Windows は合成済み (NFC) で返すため、
  # false にすると同じ日本語ファイル名が「欠落」+「余分」として二重に計上されます。
  normalize_unicode: true

  # ファイル名の大文字小文字を区別する (既定 true)。
  # Windows 共有と Linux を混在させていて Report.docx / report.docx を
  # 同一視したい場合のみ false にしてください。
  case_sensitive: true

output:
  # excel / html / both
  format: "excel"
  output_dir: "./reports"

  # HTML レポートの 1 つの表に出す最大行数 (0 = 無制限)。
  # 省略した場合は 20000 が使われます。
  #
  # 行数が多すぎるとブラウザがレポートを開けなくなります
  # (実測: 3拠点で 20,000 行はロード 1.1 秒で操作可能、50,000 行は 30 秒以上無応答)。
  # 上限を超えた分は表示せず、末尾に省略件数を注記します。
  # この上限は HTML だけに適用され、Excel には全件が出力されます。
  max_table_rows: 20000

  # 残す過去レポートの実行回数 (0 = 削除しない)。
  # 省略した場合は 0 (削除しない) です。
  #
  # 定期実行するとレポートが際限なく溜まります
  # (大きい共有だと 1 回あたり HTML 22MB + Excel 3MB、毎日なら年間 9GB 規模)。
  # 指定すると、新しいレポートを書いた後に古いものを削除して直近 N 回分だけ残します。
  #
  # 削除対象は sync-check-YYYYMMDD-HHMMSS.{html,xlsx} に完全一致するファイルだけです。
  # 固定名の sync-check.html や、出力先に置いた無関係なファイルは削除しません。
  # 1 回の実行が html と xlsx を出していれば、それらで 1 回分と数えます。
  keep_reports: 0

performance:
  parallel_workers: 4
  hash_algorithm: "sha256"

  # ハッシュを計算する範囲。
  #   always … 全ファイルを読んでハッシュを取る (既定)。更新日時を一切信用しない。
  #   smart  … 次のファイルは読まずに済ませる。ネットワーク共有では読み取り量が大幅に減る。
  #            - サイズが拠点間で違う → 内容が違うことは確定しており、ハッシュは結論を変えない
  #            - 全拠点でサイズも更新日時も一致 → 同一とみなす
  #            ※ サイズを保ったまま書き換えて更新日時も復元されたファイルは検出できません。
  #              厳密さが必要な監査用途では always を使ってください。
  hash_mode: "always"

  # smart で更新日時を「一致」とみなす許容誤差 (秒)。
  # ファイルシステムで更新日時の粒度が違う (NTFS 100ns / HFS+ 1s / FAT 2s) ため、
  # コピー時の丸めを吸収する目的で既定 2 秒。
  mtime_tolerance_sec: 2.0
