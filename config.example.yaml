# File Sync Checker - 設定ファイルサンプル
# 実環境用は config.yaml にコピーして書き換えてください。

locations:
  - name: "拠点A"
    path: "//server-a/share/docs"
  - name: "拠点B"
    path: "//server-b/share/docs"
  - name: "拠点C"
    path: "//server-c/share/docs"

# 除外パターン (glob)。
#   "/" を含まないパターン … ファイル名・ディレクトリ名と照合 (深さを問わない)
#   "/" を含むパターン     … ルートからの相対パス全体と照合
exclude_patterns:
  - "~$*"        # Office 一時ファイル
  - "*.tmp"
  - "Thumbs.db"
  - ".DS_Store"
  - "*.lnk"
  # - "作業中/*"      # 特定フォルダ配下だけ除外したい場合
  # - "*/一時/*"

# 拠点間で「同じファイル」とみなす条件。
matching:
  # ファイル名を NFC に正規化してから突き合わせる (既定 true)。
  # macOS は「が」を「か」+ 濁点 (NFD) で返し、Windows は合成済み (NFC) で返すため、
  # false にすると同じ日本語ファイル名が「欠落」+「余分」として二重に計上されます。
  normalize_unicode: true

  # ファイル名の大文字小文字を区別する (既定 true)。
  # Windows 共有と Linux を混在させていて Report.docx / report.docx を
  # 同一視したい場合のみ false にしてください。
  case_sensitive: true

output:
  # excel / html / both
  format: "excel"
  output_dir: "./reports"

performance:
  parallel_workers: 4
  hash_algorithm: "sha256"

  # ハッシュを計算する範囲。
  #   always … 全ファイルを読んでハッシュを取る (既定)。更新日時を一切信用しない。
  #   smart  … 次のファイルは読まずに済ませる。ネットワーク共有では読み取り量が大幅に減る。
  #            - サイズが拠点間で違う → 内容が違うことは確定しており、ハッシュは結論を変えない
  #            - 全拠点でサイズも更新日時も一致 → 同一とみなす
  #            ※ サイズを保ったまま書き換えて更新日時も復元されたファイルは検出できません。
  #              厳密さが必要な監査用途では always を使ってください。
  hash_mode: "always"

  # smart で更新日時を「一致」とみなす許容誤差 (秒)。
  # ファイルシステムで更新日時の粒度が違う (NTFS 100ns / HFS+ 1s / FAT 2s) ため、
  # コピー時の丸めを吸収する目的で既定 2 秒。
  mtime_tolerance_sec: 2.0
